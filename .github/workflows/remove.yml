name: Remove Canonical Tags (Deep Clean)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-canonical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (All Branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cari dan Hapus Canonical di Semua File & Cek Branch
        run: |
          echo "=== Daftar Branch ==="
          git branch -a

          python3 - << 'EOF'
          import os
          import re

          # Tangkap berbagai bentuk tag link canonical atau teks canonical
          canonical_pattern = re.compile(
              r'<link\b[^>]*canonical[^>]*>\s*',
              re.IGNORECASE
          )

          modified_count = 0

          for root, dirs, files in os.walk("."):
              if ".git" in root:
                  continue
              for file in files:
                  # Jangan edit workflow pembersih ini sendiri
                  if file == "remove-canonical.yml":
                      continue
                  if file.endswith((".html", ".htm", ".py", ".yml", ".yaml", ".js", ".php", ".txt")):
                      file_path = os.path.join(root, file)
                      try:
                          with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()

                          if "canonical" in content.lower():
                              print(f"Ditemukan kata 'canonical' di: {file_path}")
                              new_content, count = canonical_pattern.subn("", content)
                              if count > 0:
                                  with open(file_path, "w", encoding="utf-8") as f:
                                      f.write(new_content)
                                  print(f"--> Berhasil menghapus {count} baris tag canonical di {file_path}")
                                  modified_count += 1
                      except Exception as e:
                          print(f"Gagal memproses {file_path}: {e}")

          print(f"Selesai! Total file yang dibersihkan: {modified_count}")
          EOF

      - name: Commit dan Push Perubahan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🧹 Deep remove canonical tags" || echo "Tidak ada perubahan yang perlu di-commit"
          git push
